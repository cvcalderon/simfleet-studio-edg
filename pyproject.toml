[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simfleet-studio-edg"
version = "0.0.1"
description = "Scientific reproducibility core for SimFleet-EDG PRE-F3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Provisional internal research package; licence to be defined before public release"}
authors = [{name = "SimFleet-EDG research team"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<2"]
reproduction = ["numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=17,<24", "PyYAML>=6,<7", "pydantic>=2.8,<3"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "matplotlib>=3.9,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["simfleet_edg"]
strict = true
