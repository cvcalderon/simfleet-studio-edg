implementation_clarifications:
  status: FROZEN_PRE_CAL_IMPLEMENTATION_CLARIFICATIONS
  encoder:
    id: DIST_FEATURES_V1_ENCODER_V1
    reason: F3.1c froze the semantic set but not the concrete representation of chain/time state
    type: DETERMINISTIC_FULL_ONE_HOT_PLUS_RAW_NUMERIC_V1
    categorical_order: CANONICAL_LEXICAL
    unknown_token: __UNSEEN__
    missing_token: __MISSING_CONTEXT__
    rare_pooling: NONE
    numeric_missing_policy: NATIVE_NAN_LIGHTGBM
  inverse_ecdf:
    id: LINEAR_WEIGHTED_CUMULATIVE_MASS_KNOTS_V1
    reason: F3.1c froze weighted linear inverse-ECDF but not the knot convention
    support_sort: ASCENDING_DISTANCE_KM
    knots: ZERO_MIN_ANCHOR_THEN_WEIGHTED_CUMULATIVE_MASS
    interpolation: LINEAR
  dist_b_training_common:
    id: DIST_B_COMMON_TRAINING_V1
    reason: F3.1c DIST_B rows froze quantiles/depth/leaves/min_leaf/L2 but did not state learning rate or estimator count
    learning_rate: 0.05
    n_estimators: 200
  dist_b_reconstruction:
    id: DIST_B_QUANTILE_RECONSTRUCTION_V1
    reason: F3.1c froze the quantile grid but not a full-u reconstruction rule
    clamp_quantile_knots: GLOBAL_STRICT_TRAIN_RAW_MIN_MAX
    monotone_repair: CUMULATIVE_MAX_AFTER_CLAMP
    endpoint_knots: [Q0_GLOBAL_MIN, Q1_GLOBAL_MAX]
    interpolation: LINEAR_IN_QUANTILE_PROBABILITY

