    - 0.025
    - 0.975
    reason: F3.1c fixes paired household bootstrap and 95% CI but not CI construction.
  within_family_grid_selection:
    id: WITHIN_FAMILY_GRID_SELECTION_V1
    rule: AMONG_HARD_AND_GUARDRAIL_ELIGIBLE_GRIDS_CHOOSE_LOWEST_POINT_PRIMARY; EXACT_TIE_BY_LEXICAL_GRID_ID
    reason: F3.1c permits CAL hyperparameter selection but does not state the within-family
      tie/eligibility algorithm.
  sequential_family_promotion:
    id: SEQUENTIAL_FAMILY_PROMOTION_V1
    rule: START_REF; TEST_BEST_A_VS_INCUMBENT; THEN_TEST_BEST_B_VS_CURRENT_INCUMBENT
    reason: Operationalizes the frozen complexity order without a composite score.
  bootstrap_seed:
    id: BOOTSTRAP_SEED_DERIVATION_V1
    rule: SHA256(F3_3_BOOTSTRAP_V1|master_seed|component|incumbent_artifact_id|challenger_artifact_id)
      -> uint64
    reason: F3.1c requires reproducible paired bootstrap but does not define a bootstrap
      seed namespace.
  part_b_fold_assignment:
    id: PART_B_HOUSEHOLD_FOLD_ASSIGNMENT_V1
    rule: SHA256(F3_3_PART_B_CAL_FOLD_V1|master_seed|source_household_id) MOD 5
    reason: F3.1c fixes five household cross-fit folds but not deterministic fold
      assignment.
