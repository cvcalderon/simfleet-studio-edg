count_a_encoder:
  type: deterministic_reference_one_hot
  source: TRAIN_ONLY
  category_order: CANONICAL_LEXICAL
  reference_policy: FIRST_OBSERVED_CANONICAL_CATEGORY_PER_FIELD
  unknown_token: __UNSEEN__
  missing_token: __MISSING_CONTEXT__
  rare_pooling: NONE

part_ref:
  candidate_id: COUNT_REF
  fit_objective: weighted_unconditional_positive_count_pmf
  grid_id: null

part_a:
  candidate_id: COUNT_A
  target: Y_EQUALS_K_MINUS_1
  fit_objective: weighted_mean_nb2_nll_plus_l2
  nb2_parameterization: VAR_EQUALS_MU_PLUS_ALPHA_MU_SQUARED
  link: LOG
  dispersion: TRAIN_MLE
  dispersion_parameterization: ALPHA_EQUALS_EXP_LOG_ALPHA
  dispersion_penalized: false
  intercept_penalized: false
  coefficients_penalized: true
  optimizer: scipy_L-BFGS-B
  optimizer_maxiter: 3000
  optimizer_ftol: 1.0e-12
  optimizer_gtol: 1.0e-8
  coefficient_bounds: [-20.0, 20.0]
  log_alpha_bounds: [-12.0, 8.0]
  reject_if_optimizer_boundary_hit: true
  start_dispersion: WEIGHTED_METHOD_OF_MOMENTS_WITH_0_1_FLOOR
  tail_policy: TRUNCATE_AND_RENORMALIZE_NB2_TO_K_1_THROUGH_K_MAX_TRAIN
  posthoc_clip: false
  grids:
    CA1: {lambda_l2: 0.0}
    CA2: {lambda_l2: 0.1}
    CA3: {lambda_l2: 1.0}

part_b:
  candidate_id: COUNT_B
  fit_objective: weighted_empirical_positive_count_pmf
  grid_id: CB1
  hierarchy_id: COUNT_BACKOFF_V1
  support_count_basis: RAW_STRICT_TRAIN_ROWS_BEFORE_WEIGHTING
  direct_support_min_n: 30
  low_n_rule: source_n < 30
  smoothing: NONE
  probability_weight: P_GEW
  support_order: CANONICAL_LEXICAL_KEY
  canonical_count_key_format: 'K:{k:06d}'
  hierarchy:
    - [age_infr_class, sex, primary_activity_status, household_size_class, source_weekday]
    - [age_infr_class, sex, primary_activity_status, household_size_class]
    - [age_infr_class, sex, primary_activity_status]
    - [age_infr_class, primary_activity_status]
    - [primary_activity_status]
    - [age_infr_class]
    - [GLOBAL]
  note_on_season: 'source_season is in COUNT_FEATURES_V1, but COUNT_BACKOFF_V1 contains no season-conditioned level; no extra level is invented.'

output_policy:
  official_output: artifacts/runs/F3_2d_trip_count_fit_v1
  overwrite: false
  cal_metrics_emitted: false
  selection_decision_emitted: false
  test_artifacts_emitted: false
  expected_models: 5
