temporal_invariants:
  departure_clock_minute: INTEGER_0_TO_1439
  duration_from_clock_min: INTEGER_GE_1
  arrival_identity: arrival_absolute = departure_clock + duration
  arrival_clock_minute: arrival_absolute modulo 1440
  arrival_day_offset: FLOOR_arrival_absolute_div_1440_MUST_BE_0_OR_1
  chronology: departure_clock >= previous_generated_arrival_absolute_when_prefix_exists
  future_trip_feasibility: nonfinal_trip_arrival_absolute_must_be_lt_1440
  failure_policy: REJECT_OR_RESAMPLE_NEVER_SILENT_CLOCK_REPAIR
  semantics: PLANNED_SCHEDULE_PRIOR_NOT_EXECUTED_ROUTE_TRAVEL_TIME

part_ref:
  candidate_id: TIME_REF
  family: WEIGHTED_DEPARTURE_HOUR_EMPIRICAL_DISTRIBUTION
  fit_objective: weighted_empirical_departure_hour_distribution
  probability_weight: W_GEW
  primary_reference_marginal: DEPARTURE_HOUR
  auxiliary_runtime_support: GLOBAL_WEIGHTED_EMPIRICAL_DEPARTURE_DURATION_TUPLES
  silent_clock_repair: false

part_a:
  candidate_id: TIME_A
  family: WEIGHTED_CONDITIONAL_EMPIRICAL_TEMPORAL_KERNEL_WITH_BACKOFF
  fit_objective: weighted_conditional_empirical_joint_schedule_kernel
  hierarchy_id: TIME_BACKOFF_V1
  support_count_basis: RAW_STRICT_TRAIN_ROWS_BEFORE_WEIGHTING
  direct_support_min_n: 30
  low_n_rule: source_n < 30
  probability_weight: W_GEW
  max_rejection_attempts: 100
  silent_clock_repair: false
  kernel_clarification:
    status: FROZEN_PRE_CAL_IMPLEMENTATION_CLARIFICATION
    reason: F3.1c froze bandwidth values but not kernel shape
    shape: DISCRETE_CIRCULAR_UNIFORM_INTEGER_V1
    support: integer_jitter_inclusive_minus_bandwidth_to_plus_bandwidth
    duration_coupling: EMPIRICAL_JOINT_DONOR_DURATION
    arrival_reconstruction: GENERATED_DEPARTURE_PLUS_EMPIRICAL_DURATION
    invalid_draw_policy: REJECT_AT_CURRENT_LEVEL_THEN_DETERMINISTIC_BACKOFF
  hierarchy:
    - [origin_activity_analogue, destination_activity_analogue, trip_position_class, primary_activity_status, source_weekday]
    - [origin_activity_analogue, destination_activity_analogue, trip_position_class, primary_activity_status]
    - [origin_activity_analogue, destination_activity_analogue, trip_position_class]
    - [destination_activity_analogue, trip_position_class]
    - [trip_position_class]
    - [GLOBAL]
  grids:
    TA1: {bandwidth_min: 0}
    TA2: {bandwidth_min: 15}
    TA3: {bandwidth_min: 30}

part_b:
  candidate_id: TIME_B
  family: QUANTILE_GRADIENT_BOOSTING_TEMPORAL
  fit_objective: weighted_multi_quantile_pinball_departure_and_duration
  encoder:
    type: deterministic_full_one_hot_plus_raw_numeric
    source: TRAIN_ONLY
    categorical_order: CANONICAL_LEXICAL
    unknown_token: __UNSEEN__
    missing_token: __MISSING_CONTEXT__
    rare_pooling: NONE
    numeric_missing_policy: NATIVE_NAN_LIGHTGBM
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  monotone_repair: cumulative_max_then_linear_interpolation
  common:
    learning_rate: 0.05
    n_estimators: 200
  grids:
    TB1: {max_depth: 2, num_leaves: 4, min_data_in_leaf: 30, lambda_l2: 1.0}
    TB2: {max_depth: 3, num_leaves: 8, min_data_in_leaf: 30, lambda_l2: 1.0}
    TB3: {max_depth: 3, num_leaves: 8, min_data_in_leaf: 60, lambda_l2: 1.0}

