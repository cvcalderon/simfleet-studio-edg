  generated_time_prefix: [previous_departure_clock_minute, previous_arrival_absolute_minute]

target_columns:
  - target_departure_clock_minute
  - target_arrival_clock_minute
  - target_arrival_day_offset
  - target_duration_from_clock_min
weight_column: fit_weight_W_GEW
