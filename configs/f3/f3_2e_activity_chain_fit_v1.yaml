part_ref:
  candidate_id: CHAIN_REF
  fit_objective: weighted_first_order_transition_probability
  conditioning: [prefix_last_activity]
  fallback: GLOBAL_WEIGHTED_TARGET_PMF
  grid_id: null

part_a:
  candidate_id: CHAIN_A
  family: TERMINAL_AWARE_VARIABLE_ORDER_MARKOV_NGRAM_WITH_BACKOFF
  fit_objective: weighted_variable_order_categorical_loglikelihood
  hierarchy_id: CHAIN_BACKOFF_V1
  support_count_basis: RAW_STRICT_TRAIN_ROWS_BEFORE_WEIGHTING
  direct_support_min_n: 30
  low_n_rule: source_n < 30
  probability_weight: W_GEW
  target_support: TRAIN_OBSERVED_DESTINATION_ACTIVITY_SUPPORT
  start_token: __START__
  return_home_forced: false
  hierarchy:
    - [prefix_second_last_activity, prefix_last_activity, remaining_trips, primary_activity_status, source_weekday]
    - [prefix_last_activity, remaining_trips, primary_activity_status, source_weekday]
    - [prefix_last_activity, remaining_trips, primary_activity_status]
    - [prefix_last_activity, remaining_trips]
    - [prefix_last_activity]
    - [remaining_trips]
    - [GLOBAL]
  grids:
    CHA1: {dirichlet_alpha: 0.1}
    CHA2: {dirichlet_alpha: 1.0}

part_b:
  candidate_id: CHAIN_B
  family: REGULARIZED_MULTINOMIAL_LOGISTIC_NEXT_ACTIVITY
  fit_objective: weighted_mean_multinomial_cross_entropy_plus_l2
  encoder:
    type: deterministic_reference_one_hot_plus_zscore
    source: TRAIN_ONLY
    categorical_order: CANONICAL_LEXICAL
    target_class_order: CANONICAL_LEXICAL
    reference_policy: FIRST_OBSERVED_CANONICAL_CATEGORY_PER_FIELD
    target_reference_policy: FIRST_CANONICAL_TARGET_CLASS
    unknown_token: __UNSEEN__
    missing_token: __MISSING_CONTEXT__
    rare_pooling: NONE
    numeric_scaling: TRAIN_ZSCORE
  intercept_penalized: false
  coefficients_penalized: true
  optimizer: scipy_L-BFGS-B
  optimizer_maxiter: 3000
  optimizer_ftol: 1.0e-12
  optimizer_gtol: 1.0e-8
  coefficient_bounds: [-20.0, 20.0]
  reject_if_optimizer_boundary_hit: true
  grids:
    CHB1: {lambda_l2: 0.1}
    CHB2: {lambda_l2: 1.0}
    CHB3: {lambda_l2: 10.0}

