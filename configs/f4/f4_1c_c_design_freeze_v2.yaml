nonhome_supply:
  purpose_order:
  - WORK_COMMUTE
  - BUSINESS
  - EDUCATION
  - SHOPPING
  - LEISURE
  - OTHER
  location_id: osm:{element_type}:{element_id}
  location_level: OSM_SUPPLY
  crs: EPSG:4326
  one_record_per_osm_element: true
  union_multi_purpose_tags: true
  cross_osm_id_destructive_merge: false
  potential_duplicate_groups: KEEP_SEPARATE; store zero-or-more deterministic diagnostic
