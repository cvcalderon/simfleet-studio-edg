representative_point:
  node: SOURCE_NODE_COORDINATE
  polygon: POINT_ON_SURFACE_IN_EPSG_25833_THEN_TRANSFORM_TO_EPSG_4326
  invalid_geometry: EXCLUDE_AND_AUDIT
  plr_assignment: covers(point); if multiple, lexicographically smallest PLR id; none
    => OUTSIDE
  parents: derive LOR_BZR/PGR from chosen PLR hierarchy
residential_candidate_pool:
  source_classes:
  - RESIDENTIAL_BUILDING
  - RESIDENTIAL_AREA_FALLBACK
  parent_geography: M1_BEZIRK_12
  fragment_rule: INTERSECT_SOURCE_POLYGON_WITH_M1_BEZIRK_UNION_IN_EPSG_25833
  candidate_id: rescand:{element_type}:{element_id}:bezirk:{code2d}
  mass: positive finite clipped area m2
  priority:
  - IF_ANY_RESIDENTIAL_BUILDING_IN_M1_BEZIRK_USE_BUILDINGS_ONLY
  - ELSE_USE_RESIDENTIAL_AREA_FALLBACK
  - ELSE_HARD_BLOCKER
  expected_with_frozen_B_evidence: all 12 boroughs have building support; fallback
    household count expected 0
  plr_target: NONE
  capacity: NONE
  sampling_replacement: WITH_REPLACEMENT
residential_anchor_realization:
  output_cardinality: 54828
  one_per_accepted_household: true
  location_id: home:{household_id}
  level: SYNTHETIC_HOME
  crs: EPSG:4326
  canonical_parent_bezirk_id: exact M1 full14 home_zone_id
  household_members_share_anchor: true
  stable_across_days: true
  selection_namespace: F4_1C_C_RESIDENTIAL_ANCHOR_V1
  selection_hash: SHA256(namespace|household_id|full14_parent_bezirk_id|SELECT)
  unit_variate: first 8 digest bytes as unsigned big-endian integer divided by 2^64
  cdf_order: candidate_id ascending
  building_point: point_on_surface of M1-BEZIRK-clipped building fragment in EPSG:25833
  fallback_point_hash: SHA256(namespace|household_id|candidate_id|POINT|attempt);
    bytes[0:8]=>ux bytes[8:16]=>uy
  fallback_point_method: uniform bounding-box rejection into clipped polygon; covers(point)
    acceptance
  fallback_max_attempts: 10000
  fallback_failure: point_on_surface + audit flag
  realized_lor: derive PLR, LOR_BZR, PGR from final point
  hard_parent_invariant: final point maps to the same 2-digit district as exact M1
    full14 parent
serialization:
  format: DETERMINISTIC_CSV_GZ_V1
  encoding: UTF-8
  newline: LF
  header: true
  json_subfields: minified + sort_keys=True
  gzip_mtime: 0
