terminology:
  M1_BEZIRK: 12 administrative Berlin boroughs; full 14-digit Zensus GEOBZ1/home_zone_id
  M1_BEZIRK_CODES: &id001
  - '11000000000001'
  - '11000000000002'
  - '11000000000003'
  - '11000000000004'
  - '11000000000005'
  - '11000000000006'
  - '11000000000007'
  - '11000000000008'
  - '11000000000009'
  - '11000000000010'
  - '11000000000011'
  - '11000000000012'
  LOR_BZR: 143 LOR Bezirksregionen; 6-digit IDs
  LOR_PLR: 542 LOR Planungsräume; 8-digit IDs
  LOR_PGR: 58 LOR Prognoseräume
  rule: Never use LOR_BZR as the M1 household parent geography.
bezirk_lor_bridge:
  m1_full14_to_code2d: last two characters of validated full14 M1 BEZIRK code
  lor_bzr_membership: LOR_BZR id starts with code2d
  lor_plr_membership: LOR_PLR id starts with code2d
  m1_bezirk_geometry: unary union of all frozen LOR_BZR geometries whose id starts
    with code2d
  required_group_count: 12
  required_bzr_total: 143
  required_plr_total: 542
  validation: Every frozen LOR_BZR/PLR prefix belongs to 01..12 and maps to exactly
    one M1 BEZIRK.
