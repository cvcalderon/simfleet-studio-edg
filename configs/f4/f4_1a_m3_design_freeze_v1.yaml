    source_resolution: BEZIRK_ONLY
    interpretation: spatial_context_not_point_location
    household_stability_required: true
    finer_realization_required: true
    exact_mid_home_coordinate_available: false
  destination:
    exact_mid_destination_coordinate_available: false
    actual_realization_source: EXTERNAL_SPATIAL_SUPPLY
  distance:
    upstream_artifact: DIST_REF_REFERENCE
    semantic_role: M2_DISTANCE_PRIOR
    not_exact_od: true
    not_route_length: true
    not_mode_specific: true
    m3_must_define_prior_to_spatial_separation_relation: true

spatial_supply_semantics:
  eligibility: HARD_PURPOSE_COMPATIBILITY_FILTER
  attractiveness: SOFT_POSITIVE_WEIGHT_SEPARATE_FROM_ELIGIBILITY
  capacity: STRUCTURAL_SUPPLY_CONSTRAINT_SEPARATE_FROM_ATTRACTIVENESS
