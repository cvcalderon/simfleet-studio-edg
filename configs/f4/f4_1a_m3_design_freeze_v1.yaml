candidate_families:
  S_NEAR: {role: DIAGNOSTIC_BASELINE, selection: NOT_YET_AUTHORIZED, definition: nearest_eligible_location_from_current_origin}
  S_DIST: {role: CORE_CANDIDATE, selection: NOT_YET_AUTHORIZED, definition: eligible_location_conditioned_on_M2_distance_prior}
  S_ATTR: {role: CORE_CANDIDATE, selection: NOT_YET_AUTHORIZED, definition: eligible_location_conditioned_on_distance_compatibility_and_declared_attractiveness_capacity}
  winner: NONE

hard_invariants:
