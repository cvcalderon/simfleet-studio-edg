    expected_stage1_L1_total: 161
    expected_stage2_L1_total: 272
    expected_stage3_L1_total: 478
    expected_max_detailed_abs_adjustment: 12
    implementation_tolerance: exact stage1_2_3 and max-adjustment anchors; stage4 must use CANONICAL_WEIGHTED_LINEAR_V1
  G_EMPIRICAL_fit_metrics:
    - MAE
    - absolute_error
    - relative_error
    - MAPE_where_defined
    - P50_P90_P95_P99_max
    - small_cell_stratification
    - by_Bezirk
    - by_age
    - by_sex
    - by_household_size
  G_EMPIRICAL_preservation_metrics:
    - P(primary_activity_status | age_infr_class)
    - P(car_driver_license | age_infr_class, sex)
    - P(household_car_stock | household_size_class)
    - P(household_bike_ebike_stock | household_size_class)
  threshold_policy:
    numeric_materiality_thresholds: freeze from TRAIN+CALIBRATION after implementation and before G1 TEST
    TEST_threshold_tuning: forbidden
    failed_TEST_requires_new_lineage: true
  P_CONSTR_vs_P_TRS:
    rule: P_CONSTR retained only if CAL shows preregistered material fit improvement without material preservation degradation or unacceptable engineering cost
    winner_between_HD_U_HD_W: CALIBRATION only

TEST_policy:
  split_manifest: original household split seed 20260912
  G1_TEST_role: population-preservation evaluation only after candidate and thresholds frozen
  F3_heldout_runner: DO_NOT_RERUN
  G2: DO_NOT_REOPEN
  limitation: mobility TEST outcomes were previously consumed for G2; G1 must not use them for tuning and may only evaluate its separately preregistered M1 preservation metrics

implementation_boundary:
